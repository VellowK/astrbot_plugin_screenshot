[project]
name = "astrbot-plugin-screenshot"
version = "1.1.1"
description = "AstrBot 网页快照兜底解析器，内置 Chromium 自动准备与状态检测，支持 NodeSeek 正文与置顶/Hot 评论、代理和域名路由。"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["playwright>=1.48,<2", "python-socks[asyncio]>=2.5,<4"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".research"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
